# Only the API and Redis run on Render. The frontend is on Vercel and the
# database on Neon; both URLs are set in the Render dashboard (sync: false), so a
# Blueprint sync never overwrites them.
services:
  - type: redis
    name: researchforge-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: researchforge-api
    plan: free
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn researchforge.api.app:create_app --factory --host 0.0.0.0 --port 10000
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_ENV
        value: production
      - key: APP_LOG_LEVEL
        value: INFO
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL # Neon direct (non-pooled) connection string
        sync: false
      - key: REDIS_URL
        fromService:
          name: researchforge-redis
          type: redis
          property: connectionString
      - key: CORS_ORIGINS # the Vercel site URL, e.g. https://researchforge-ai-lyart.vercel.app
        sync: false
