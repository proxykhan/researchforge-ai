name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: researchforge-ai

permissions:
  id-token: write
  contents: read

jobs:
  # ── Test ─────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: researchforge
          POSTGRES_PASSWORD: researchforge
          POSTGRES_DB: researchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://researchforge:researchforge@localhost:5432/researchforge_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=researchforge --cov-report=term-missing -q

  # ── Build Docker image ───────────────────────────────────────
  build:
    name: Build Docker Image
    needs: [test]
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Push to Amazon ECR (Phase 12-13) ─────────────────────────
  push-ecr:
    name: Push to ECR
    needs: [build]
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to AWS (Phase 12-13) ──────────────────────────────
  deploy:
    name: Deploy to AWS
    needs: [push-ecr]
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-role
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run database migration
        run: |
          echo "::notice::Database migration will be configured in Phase 12-13"

      - name: Deploy ECS service
        run: |
          echo "::notice::ECS deployment will be configured in Phase 12-13"

      - name: Smoke test
        run: |
          echo "::notice::Smoke tests will be configured in Phase 12-13"

      - name: Health check
        run: |
          echo "::notice::Health checks will be configured in Phase 12-13"
