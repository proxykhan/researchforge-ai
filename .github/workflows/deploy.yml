name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  IMAGE_NAME: researchforge-ai
  ECS_CLUSTER: researchforge-prod
  ECS_API_SERVICE: researchforge-prod-api
  ECS_WORKER_SERVICE: researchforge-prod-worker

permissions:
  id-token: write
  contents: read

jobs:
  # ── Test ─────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: researchforge
          POSTGRES_PASSWORD: researchforge
          POSTGRES_DB: researchforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://researchforge:researchforge@localhost:5432/researchforge_test
      REDIS_URL: redis://localhost:6379/0
      AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/ tests/

      - name: Type check
        run: mypy src/

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest --cov=researchforge --cov-report=term-missing -q

  # ── Build and push Docker image ──────────────────────────────
  push-ecr:
    name: Build & Push to ECR
    needs: [test]
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''
    outputs:
      image: ${{ steps.image.outputs.uri }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/researchforge-github-actions-role
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image URI
        id: image
        run: echo "uri=${{ steps.ecr-login.outputs.registry }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

  # ── Deploy to AWS ────────────────────────────────────────────
  deploy:
    name: Deploy to AWS
    needs: [push-ecr]
    runs-on: ubuntu-latest
    if: vars.AWS_ACCOUNT_ID != ''
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/researchforge-github-actions-role
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run database migration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: alembic upgrade head

      - name: Update API service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_API_SERVICE }} \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

      - name: Update worker service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_WORKER_SERVICE }} \
            --force-new-deployment \
            --query 'service.serviceName' \
            --output text

      - name: Wait for API service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_API_SERVICE }}

      - name: Smoke test
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ECS_CLUSTER }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          if [ -z "$ALB_DNS" ]; then
            echo "::warning::ALB not found — skipping smoke test"
            exit 0
          fi
          echo "Testing http://$ALB_DNS/api/v1/health"
          curl -sf "http://$ALB_DNS/api/v1/health" | jq .

      - name: Health check
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names "${{ env.ECS_CLUSTER }}-alb" \
            --query 'LoadBalancers[0].DNSName' \
            --output text 2>/dev/null || echo "")
          if [ -z "$ALB_DNS" ]; then
            echo "::warning::ALB not found — skipping health check"
            exit 0
          fi
          echo "Testing http://$ALB_DNS/api/v1/ready"
          curl -sf "http://$ALB_DNS/api/v1/ready" | jq .
          echo "Deployment successful"
